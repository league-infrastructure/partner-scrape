org_name = "Greater San Diego Science and Engineering Fair"
adapter_type = "program_page_multi"
enabled = true

[config]
url = "https://www.gsdsef.org/information/schedule"
program_kind = "program"
opportunity_type = "Competitions"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = true
fetch_strategy = "static"
discovered_via = "partners_viable.csv tier-2 bulk registration (2026-07-20); sprint 029 ticket 005 (issue 30, SUC-048) config edit, live-verified end-to-end via real dry-run (2026-09-02)"
