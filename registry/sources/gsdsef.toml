# Week (`date_start = "2027-03-08"`, `date_end = "2027-03-14"`,
# `registration_deadline = "2027-02-19"`, the Application & Payment
# deadline) -- the model treats the week as one program with an
# internal day-by-day itinerary, not N separate top-level programs, so
