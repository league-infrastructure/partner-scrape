# LIVE VERIFICATION FINDING, `generic_html` (the pre-existing
# registration): the sprint 015 addendum's "did not parse is gone"
# claim does NOT hold today -- a fresh, real
# `uv run partner-scrape --source gsdsef --dry-run -v` run reproduced
