# failure (0 URLs discovered, 0 events) under the *still-registered*
# `fetch_strategy = "headless"`. Traced directly: this project's own
# on-disk fetch cache (`fetch/cache.py`, keyed by URL+domain, not by
# fetch_strategy) held a stale entry for `sitemap.xml` from an earlier
# (2026-08-30) headless fetch whose body genuinely was Chromium's
# rendered XML-viewer markup -- the exact bug the sprint 015 addendum
# above describes -- and PoliteFetcher's conditional-GET revalidation
# keeps re-serving that stale, mangled body indefinitely (the live
# server-side resource is unchanged, so revalidation succeeds and never
# triggers a fresh raw fetch). Deleting that one stale cache entry and
# re-running confirms the underlying bug is real and current, not
# fixed: `sitemap.xml` fetched fresh via `fetch_strategy = "static"`
# (no Playwright/Chromium involved at all) returns a clean, valid
# sitemap XML body directly from curl AND from this project's own
# `PoliteFetcher()` -- so the "did not parse" failure is specifically
# a `fetch/headless.py` (`PlaywrightFetcher`) XML-content-type
# rendering bug, reproduced live today, contradicting the sprint 015
# addendum's "fixed" claim for this exact failure mode. Flipping
# `fetch_strategy` to `"static"` below (this file's own config edit,
# in scope for this ticket) fixes sitemap discovery: a fresh run then
# finds 3 real URLs (`slb/workshops`, `students/workshops`, `calendar`
# -- the same three sprint 015 named), but **none of them carry the
# fair week's judging/public-day dates** -- `students/workshops`'s own
# extracted title is literally "Workshops (OLD, DO NOT USE)" and
# `calendar`'s page states "Calendar and Schedule (NOT IN USE)" with
# only two unrelated dates (student registration open, application
# payment deadline). This is a second, independent problem from the
# fetch-cache bug: `discovery/sitemap.py`'s `EVENT_PATH_RE` (matching
# `/events?/`, `/calendar/`, `/programs?/`, `/workshops?/`, etc. path
# segments) structurally cannot discover the one page that actually
# carries the fair-week schedule, `/information/schedule` -- its path
# matches none of those patterns. No amount of cache/fetch-strategy
# fixing recovers these dates through `generic_html`'s sitemap-diff
# discovery mechanism.
#
# FIX: `adapter_type` changed to `program_page_multi`, `config.url`
# pointed directly at `https://www.gsdsef.org/information/schedule`
# (bypassing sitemap-diff discovery entirely -- the program_page family
