# LIVE-VERIFIED EXTRACTION (2026-09-02, real network, real
# `AnthropicProgramLLMClient`, reproduced 3x for `extract_programs()`
# and 2x for the singular `extract_program()` -- both consistently
# agree): the page currently shows the org's *next* cycle, "2027 GSDSEF
# Fair Week Dates: March 8-14, 2027" -- Monday/Tuesday setup, **Wednesday
# March 10, 2027: Category/Special/Grand Awards Judging**, Thursday
# evening Awards Ceremony, Friday BPAC closed (student tours only),
# **Saturday March 13, 2027: "BPAC open to public to view projects"**
# (the public day), Sunday cleanup. Every one of 5 real extraction
