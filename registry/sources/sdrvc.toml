org_name = "San Dieguito River Valley Conservancy"
adapter_type = "generic_html"
enabled = true

[config]
site_url = "https://www.sdrvc.org"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = true
fetch_strategy = "headless"
discovered_via = "partners_viable.csv tier-1C bulk registration (2026-07-20)"

