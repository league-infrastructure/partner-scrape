# San Diego Zoo -- Classic Camp, 1st Grade. See
# sd-zoo-classic-camp-kindergarten.toml for the shared per-page shape
# this whole nine-page batch follows (two four-week themed
# sub-programs, same weekly price, program_page_multi).
#
# Live-verified 2026-09-01: GET
# https://zoo.sandiegozoo.org/kids-programs/classic-camp-first-grade
# returns HTTP 200, "$525* Price details", same two-theme/eight-week
# UPCOMING DATES structure as the kindergarten page.
#
# Live dry-run confirmed (`--source sd-zoo-classic-camp-first-grade
# --dry-run -v`): found=2 dated=2 -- the LLM call collapsed each
# four-week theme into one spanning record ($525, `is_open=true`)
# rather than four per-week rows -- a legitimate LLM
# extraction-granularity choice on this page's ambiguous shape (see
# the kindergarten page's own comment); both records are still
# correctly dated and priced.

org_name = "San Diego Zoo Wildlife Alliance -- Classic Camp (1st Grade)"
adapter_type = "program_page_multi"
enabled = true

[config]
url = "https://zoo.sandiegozoo.org/kids-programs/classic-camp-first-grade"
program_kind = "program"
opportunity_type = "Camps"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = true
discovered_via = "issue 29 (2026-08-30 camp session extraction); sprint 028 ticket 004 live verification (2026-09-01)"
