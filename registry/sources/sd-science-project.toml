# San Diego Science Project (SDSP) -- the region's site of the
# statewide California Science Project, housed within UCSD CREATE.
# Sprint 030 ticket 005 (issue 33 part 1). SDSP's own `/sdspevents`
# page (distinct from its no-dates homepage) carries multiple inline
# dated items (a monthly Teacher/Researcher Collaborative plus
# partner-program cards -- 2026 RET @ Penn State, BASP California
# Wildfire Workshops, Young Scholars Program @ UCSD) -- registered as
# `program_page_multi` against that events page specifically, not the
# homepage.
#
# LIVE-VERIFIED 2026-09-02, real network + real
# `AnthropicProgramLLMClient` via `uv run partner-scrape --source
# sd-science-project --dry-run -v`:
#
#   GET https://www.sdscienceproject.org/sdspevents -> HTTP 200.
#   `found=3 dated=2 new=1`, `wrote 0` in this dry run. Direct
#   `extract()` inspection confirms two correctly-dated, correctly-typed
#   records: "2026 Research Experience for Teachers (RET) @ Penn State"
#   (2026-07-13 to 2026-07-24, eligibility "Middle and high school
#   teachers") and "BASP California Wildfire Workshops (Using UGC)"
#   (2026-08-04 to 2026-08-05, eligibility "High school biology or
#   chemistry teachers"). Both dates are already past relative to this
#   verification date (2026-09-02) -- `wrote 0` is the existing currency
#   filter correctly excluding an already-past record, not a broken
#   extraction, matching `doe-science-bowl-sd.toml`'s identical accepted
#   precedent. A third item ("Teacher/Researcher Collaborative") has no
#   recoverable date at all (a recurring monthly series with no single
#   canonical date on the page) and is correctly left undated rather
#   than fabricated. Registered enabled on this basis -- next year's
#   cycle will be picked up automatically by the existing weekly cron,
#   no further registry change needed. No instruction-shaped content
#   found on the fetched page.

org_name = "San Diego Science Project"
adapter_type = "program_page_multi"
enabled = true

[config]
url = "https://www.sdscienceproject.org/sdspevents"
program_kind = "program"
opportunity_type = "Professional Development / Conferences"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = true
discovered_via = "issue 33 part 1 (educator-PD program pages); sprint 030 ticket 005, live-verified via real dry-run (2026-09-02)"
