# SeaPerch San Diego Regional -- organized by the Classroom of the
# Future Foundation. Sprint 029 ticket 001 (issue 30's single-event
# program_page competition batch), `program_page` adapter,
# `config.opportunity_type = "Competitions"` per the sprint's
# operator-curated-override mechanism decision (registry/DESIGN.md's
# sprint 029 addendum).
#
# CORRECTION (2026-09-02): this ticket's first pass (2026-09-01)
# registered this source `enabled = true` claiming a "correctly-dated"
# WebFetch summary of "Saturday, April 4th, 2026" -- never confirmed
# against the real adapter. A real end-to-end
# `uv run partner-scrape --source seaperch-sd-regional --dry-run -v`
# run (2026-09-02, real network, real `AnthropicProgramLLMClient`,
# reproduced twice for consistency) shows the page DOES fetch cleanly
# and DOES contain the April 4 2026 competition date in its reduced
# text ("Location: Kearny Mesa Pool Date: Saturday, April 4th, 2026"),
# but the LLM extraction consistently maps only the *Technical Design
# Report submission deadline* ("Friday March 27, 2026") into
# `date_end`, leaving `date_start` empty and never recovering the
# actual competition date -- reproduced identically across two
# independent extraction calls against the same fetched text, so this
# is a systematic extraction-mapping miss, not one-off model noise.
# `found=1 dated=0`, `wrote 0 opportunities`. A record built from the
# TDR deadline alone would misrepresent the actual event date if it
# were later shown as "the competition," so this is registered
# disabled rather than accepted as partially usable. Fixing the
# extraction prompt/mapping is out of this registry-only ticket's
# scope -- flagged here as a follow-up. Re-verify once that lands, or
# if the page's own copy is reworded to make the competition date more
# prominent than the TDR deadline.

org_name = "Classroom of the Future Foundation"
adapter_type = "program_page"
enabled = false  # disabled: real dry-run extraction (2026-09-02, reproduced twice) consistently recovers only the TDR submission deadline, not the actual April 4 2026 competition date -- see comment above

[config]
url = "https://classroomofthefuture.org/seaperch-san-diego-regional-competition/"
program_kind = "program"
opportunity_type = "Competitions"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = true
discovered_via = "issue 30 (2026-08-30 competition sources without feeds); sprint 029 ticket 001 (corrected 2026-09-02 after a WebFetch-only check that never exercised the real extraction pipeline)"
