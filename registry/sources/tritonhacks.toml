# TritonHacks -- a UCSD student-run, weekend-long hackathon for high
# school students. Sprint 029 ticket 001 (issue 30's single-event
# program_page competition batch), `program_page` adapter,
# `config.opportunity_type = "Competitions"` per the sprint's
# operator-curated-override mechanism decision (registry/DESIGN.md's
# sprint 029 addendum). Registered directly against the event's own
# official page (`tritonhacks.org`), not
# `hackathons.hackclub.com`'s aggregator -- per issue 30's explicit
# instruction to register each hackathon's own page.
#
# CORRECTION (2026-09-02): this ticket's first pass (2026-09-01)
# registered this source `enabled = true` claiming a "correctly-dated"
# WebFetch summary of "May 16 & 17" (2026) -- never confirmed against
# the real adapter. A real end-to-end
# `uv run partner-scrape --source tritonhacks --dry-run -v` run
# (2026-09-02, real network, real `AnthropicProgramLLMClient`) shows
# the page fetches cleanly and the reduced text does contain
# "Sign up here! May 16 & 17 Sign up deadline: May 8th 11:59pm", but
# no year appears anywhere near those dates in the visible text -- the
# only "2026" on the whole page is the site's own footer copyright
# line ("(c) TritonHacks 2026 * UC San Diego"). The LLM extraction
# picked up the day/month but guessed the wrong year for the deadline
# (`date_end = "2025-05-08"`, already past even at this project's own
# 2026-09-02 verification date), leaving `date_start` empty.
# `found=1 dated=0`, `wrote 0 opportunities`. A wrong-year date is
# worse than none -- registered disabled rather than shipped with an
# inaccurate year. Re-verify once the page states an explicit year
# next to its event dates (or once TritonHacks 2027's dates are
# announced with a year attached).

org_name = "TritonHacks (UC San Diego)"
adapter_type = "program_page"
enabled = false  # disabled: real dry-run extraction (2026-09-02) recovers the correct month/day but the wrong year (no year appears near the dates in the fetched text) -- see comment above

[config]
url = "https://www.tritonhacks.org/"
program_kind = "program"
opportunity_type = "Competitions"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = true
discovered_via = "issue 30 (2026-08-30 competition sources without feeds); sprint 029 ticket 001 (corrected 2026-09-02 after a WebFetch-only check that never exercised the real extraction pipeline)"
