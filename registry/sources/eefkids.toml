# EastLake Educational Foundation -- The Events Calendar REST API.
# Endpoint verified working in dev/fetch_tec_api.py's TEC_SITES list.
#
# Re-verified live 2026-08-30 (sprint 014 ticket 003 / issue 24
# triage): GET https://eefkids.org/wp-json/tribe/events/v1/events/
# ?per_page=1 returns HTTP 200, {"events": [], "total": 0,
# "total_pages": 0} -- a healthy, reachable API genuinely reporting
# zero current events, not an error or a misconfiguration. Kept
# enabled=true with this confirming comment, matching the ATS boards'
# "zero currently-open matches is not an error" convention
# (boundlessbio.toml et al.) rather than disabled.

org_name = "EastLake Educational Foundation"
adapter_type = "tec_rest"
enabled = true

[config]
api_base = "https://eefkids.org/wp-json/tribe/events/v1/events/"
domain = "www.eefkids.org"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = true
discovered_via = "dev/fetch_tec_api.py; re-verified live sprint 014 ticket 003 (2026-08-30)"
