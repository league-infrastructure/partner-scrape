# San Diego-area Girls Who Code (GWC) clubs static roster -- a
# committed, hand-curated roster, not a live acquisition source,
# matching hack-club-sd.toml's own precedent exactly (issue 35's "Do
# NOT design live scrapers" + issue 35b's own "curated, static-roster
# datasets by design" instruction). Sprint 032 ticket 007: one
# confirmed San Diego-area GWC club (Canyon Crest Academy), the
# one entry this ticket's own live research could confirm through a
# genuinely public, citable source (the school's own current
# ASB-published approved-clubs roster) after GWC's official club
# locator (girlswhocode.com/locations) was directly tested and found
# to return a 404 -- no public, browsable San Diego listing exists at
# that URL. See directory/DESIGN.md's sprint 032 ticket 007 Revision
# for the full writeup, including the San Diego Public Library lead
# that could not be independently confirmed live and was deliberately
# left out rather than transcribed from stale/dead sources.
#
# `adapter_type` is read by directory.pipeline to select the matching
# ClubSource ("club_static_roster" ->
# directory.sources.club_static_roster.ClubStaticRosterSource), not by
# adapters.base.ADAPTERS -- see sources/club_static_roster.py's own
# module docstring.
#
# No [acquisition_policy] section: ClubStaticRosterSource reads
# config.roster_path straight off disk, matching hack-club-sd.toml's
# own precedent exactly.

org_name = "San Diego-area Girls Who Code clubs (curated static roster)"
adapter_type = "club_static_roster"
enabled = true

[config]
# Resolved relative to directory/data/ when not already an absolute
# path (sources/club_static_roster.py's discover()).
roster_path = "girls-who-code-sd.tsv"
