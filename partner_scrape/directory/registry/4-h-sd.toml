# San Diego County 4-H clubs static roster -- a committed,
# hand-curated roster, not a live acquisition source, matching
# hack-club-sd.toml's own precedent exactly (issue 35's "Do NOT design
# live scrapers" + issue 35b's own "curated, static-roster datasets by
# design" instruction). Sprint 032 ticket 005: fourteen San Diego
# County 4-H community clubs, live-verified against UC ANR's own
# San Diego County 4-H "Community Clubs" directory (the top-level page
# plus its four Area 1/2/4/5 sub-pages) -- see directory/DESIGN.md's
# sprint 032 ticket 005 Revision for sources checked, including the
# honest finding that no San Diego-specific robotics/drone/AI-branded
# 4-H club was confirmed (the one "4-H Area14 Robotics Club" found in
# research is in Bridgewater Township, New Jersey, not San Diego
# County, and is deliberately excluded).
#
# `adapter_type` is read by directory.pipeline to select the matching
# ClubSource ("club_static_roster" ->
# directory.sources.club_static_roster.ClubStaticRosterSource), not by
# adapters.base.ADAPTERS -- see sources/club_static_roster.py's own
# module docstring.
#
# No [acquisition_policy] section: ClubStaticRosterSource reads
# config.roster_path straight off disk, matching hack-club-sd.toml's
# own precedent exactly.

org_name = "San Diego County 4-H clubs (curated static roster)"
adapter_type = "club_static_roster"
enabled = true

[config]
# Resolved relative to directory/data/ when not already an absolute
# path (sources/club_static_roster.py's discover()).
roster_path = "4-h-sd.tsv"
