# Places static roster -- a committed, hand-researched curation, not a
# live acquisition source (issue 35's explicit instruction: "Do NOT
# design live scrapers for either directory"). Loaded via
# registry.loader.load_active_sources (reused verbatim, no new schema)
# against this directory (partner_scrape/directory/registry/), NOT the
# main partner_scrape/registry/sources/ directory -- directory sources
# are structurally disjoint from the Opportunity registry, mirroring
# teams/registry/'s own precedent (see directory/DESIGN.md's
# Constraints).
#
# `adapter_type` is read by directory.pipeline to select the matching
# PlaceSource ("static_roster" -> directory.sources.static_roster.
# StaticRosterSource), not by adapters.base.ADAPTERS. This source is
# never registered there, and it never calls the injected Fetcher --
# see sources/static_roster.py's own module docstring.
#
# No [acquisition_policy] section: StaticRosterSource reads
# config.roster_path straight off disk, so a rate limit / robots-respect
# policy has no meaning here -- matching teams/registry/fll-sd.toml's
# own precedent exactly. The registry loader's own defaults
# (registry/schema.py's _ACQUISITION_POLICY_DEFAULTS) fill in harmlessly
# unused values when the section is omitted.

org_name = "San Diego STEM Places (curated static roster)"
adapter_type = "static_roster"
enabled = true

[config]
# Resolved relative to directory/data/ when not already an absolute
# path (sources/static_roster.py's discover()).
roster_path = "places.toml"
