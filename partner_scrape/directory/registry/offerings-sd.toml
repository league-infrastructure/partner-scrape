# Offerings static roster -- a committed, hand-researched curation, not
# a live acquisition source (issue 35's original instruction, extended
# to Offerings by sprint 030: "Do NOT design live scrapers for either
# directory"). Loaded via registry.loader.load_active_sources (reused
# verbatim, no new schema) against this directory
# (partner_scrape/directory/registry/), NOT the main
# partner_scrape/registry/sources/ directory -- directory sources are
# structurally disjoint from the Opportunity registry, mirroring
# places-sd.toml's/hack-club-sd.toml's own precedent (see
# directory/DESIGN.md's Constraints).
#
# `adapter_type` is read by directory.pipeline to select the matching
# OfferingSource ("offering_static_roster" -> directory.sources.
# offering_static_roster.OfferingStaticRosterSource), not by
# adapters.base.ADAPTERS. This source is never registered there, and
# it never calls the injected Fetcher -- see
# sources/offering_static_roster.py's own module docstring.
#
# No [acquisition_policy] section: OfferingStaticRosterSource reads
# config.roster_path straight off disk, so a rate limit / robots-respect
# policy has no meaning here -- matching places-sd.toml's/
# hack-club-sd.toml's own precedent exactly. The registry loader's own
# defaults (registry/schema.py's _ACQUISITION_POLICY_DEFAULTS) fill in
# harmlessly unused values when the section is omitted.

org_name = "San Diego STEM Offerings (curated static roster)"
adapter_type = "offering_static_roster"
enabled = true

[config]
# Resolved relative to directory/data/ when not already an absolute
# path (sources/offering_static_roster.py's discover()).
roster_path = "offerings.toml"
