# U.S. Naval Sea Cadet Corps (NSCC) units static roster -- a
# committed, hand-curated roster, not a live acquisition source,
# matching hack-club-sd.toml's own precedent exactly (issue 35's "Do
# NOT design live scrapers" + issue 35b's own "curated, static-roster
# datasets by design" instruction). Sprint 032 ticket 004: four
# San Diego/North County NSCC units, live-verified against each unit's
# own site (where one exists) and Navy League San Diego's own current
# youth-programs page -- see directory/DESIGN.md's sprint 032 ticket
# 004 Revision for sources checked, and that same Revision for two
# units found but excluded (Challenger Division, Coronado Battalion --
# both show signs of being currently inactive/suspended).
#
# `adapter_type` is read by directory.pipeline to select the matching
# ClubSource ("club_static_roster" ->
# directory.sources.club_static_roster.ClubStaticRosterSource), not by
# adapters.base.ADAPTERS -- see sources/club_static_roster.py's own
# module docstring.
#
# No [acquisition_policy] section: ClubStaticRosterSource reads
# config.roster_path straight off disk, matching hack-club-sd.toml's
# own precedent exactly.

org_name = "San Diego-area Naval Sea Cadet Corps units (curated static roster)"
adapter_type = "club_static_roster"
enabled = true

[config]
# Resolved relative to directory/data/ when not already an absolute
# path (sources/club_static_roster.py's discover()).
roster_path = "sea-cadets-sd.tsv"
