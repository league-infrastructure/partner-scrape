# San Diego-area Science Olympiad school teams static roster -- a
# committed, hand-curated roster, not a live acquisition source,
# matching hack-club-sd.toml's own precedent exactly (issue 35's "Do
# NOT design live scrapers" + issue 35b's own "curated, static-roster
# datasets by design" instruction). Sprint 032 ticket 006: twenty-four
# San Diego County high schools that fielded a Division C team at the
# 2026 San Diego Regional Science Olympiad Tournament (Feb 28, 2026,
# University of San Diego), live-verified against Duosmium Results'
# archived official tournament results
# (duosmium.org/results/2026-02-28_sCA_san_diego_regional_c/) and the
# official San Diego Regional's own site (scilympiad.com/sdso, live
# and reachable as of this ticket -- unlike sprint 029's own finding
# for that same URL) -- see directory/DESIGN.md's sprint 032 ticket 006
# Revision for sources checked.
#
# `adapter_type` is read by directory.pipeline to select the matching
# ClubSource ("club_static_roster" ->
# directory.sources.club_static_roster.ClubStaticRosterSource), not by
# adapters.base.ADAPTERS -- see sources/club_static_roster.py's own
# module docstring.
#
# No [acquisition_policy] section: ClubStaticRosterSource reads
# config.roster_path straight off disk, matching hack-club-sd.toml's
# own precedent exactly.

org_name = "San Diego-area Science Olympiad school teams (curated static roster)"
adapter_type = "club_static_roster"
enabled = true

[config]
# Resolved relative to directory/data/ when not already an absolute
# path (sources/club_static_roster.py's discover()).
roster_path = "science-olympiad-sd.tsv"
