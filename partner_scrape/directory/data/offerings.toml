description = "Hands-on invention/engineering activities exploring STEM careers and Internet-of-Things engineering projects, delivered through school-hosted \"Hub\" (large, 3-5 days/week) or \"Spoke\" (single school/district, periodic sessions) sites. San Diego Unified School District sites: Lewis Middle School, Morse High School, and Taft Middle School. Sweetwater Union High School District site: Scripps Mesa STEAM Lab. Qualcomm's own original on-campus San Diego lab has closed and no longer hosts school visits directly."
