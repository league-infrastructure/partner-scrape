offering_type = "free_program"
description = "Grant-funded, no-cost field trips to the San Diego Zoo or Safari Park for San Diego County school groups, alongside the Zoo's standard (paid) school-group visit program."
eligibility = "Grade-specific: Grade 1 -- Title I schools in San Diego County only; Grade 2 -- all San Diego County classes; Grades 3 and 4 -- Title I schools in San Diego County only; Grade 5 -- select districts or Title I schools in San Diego County. The Zoo's general school-group program (which these free trips are booked alongside) additionally requires the school be listed on the CA Department of Education Directory and located in San Diego County, with reservations required about one month in advance."
