[[offering]]
offering_id = "fleet-science-center-school-programs"
org_name = "Fleet Science Center"
title = "Discounted Field Trips, Access Science Scholarships, Science to Go, and Family Science Nights"
offering_type = "free_program"
description = "Discounted school-group admission for on-site field trips (with Access Science Scholarships covering part of the cost for Title 1 public schools); Science to Go brings interactive workshops/assembly shows on-site to a school, library, or community center; Family Science Nights bring a themed 90-minute hands-on science event to a school for children, parents, and teachers together."
eligibility = "Field trips: any San Diego County school (special discounted rate); Access Science Scholarships specifically for Title 1 public schools of San Diego County, partially or fully awarded up to an $800/school cap per August-July school year. Science to Go / Family Science Nights: any school or community venue able to host the outreach team."
how_to_book = "Field trips: complete the Request Form; the Fleet's education team confirms booking (currently accepting 2026-27 school year requests). Science to Go: schedule at least two weeks in advance ($325 single/$500 double program for up to 25 students, plus a $6/student fee above 25 up to 34, plus mileage past 30 miles round-trip). Family Science Nights: schedule at least two weeks in advance ($738 flat, up to 300 participants, 90 minutes, mileage fee past 15 miles). Contact: education@rhfleet.org or 619-238-1233."
link_url = "https://www.fleetscience.org/learn/school-programs/field-trips-fleet"
last_verified = "2026-09-02"
status = "active"
related_partner_id = 121

[[offering]]
