# Curated standing "here's what this org offers and how to get it"
# records -- serving both issue 14 Strategy B (volunteer org profiles)
# and issue 33 part 2 (free/Title I school-program records) through one
# `offering_type`-discriminated shape (see `directory/model.py`'s
# `Offering` docstring and this sprint's `directory/DESIGN.md` Revision
# for the full rationale). Never a live scrape (issue 35's original
# instruction, extended to Offerings by sprint 030).
#
# `related_partner_id` is a deliberate, hand-verified join against
# `data/partners.json`'s own `id` field -- never auto-derived, reusing
# `places.toml`'s existing convention exactly (the design docs' own
# `site/src/data/partners.json` path predates sprint 019's `site/`
# removal -- see `tests/directory/test_dataset_validity.py`'s own note
# on this). Omitted entirely where no confident partner-roster match
# exists.
#
# Six volunteer org profiles below (ticket 002, issue 14 Strategy B),
# live-verified 2026-09-02 against each org's own current volunteer
# page. Age minimums: Fleet 18, SDZWA 18, Birch 16 -- matching issue
# 14's 2026-08-30 research verbatim. The Nat, I Love A Clean San Diego
# (ILACSD), and San Diego River Park Foundation each publish no general
# numeric age minimum as of this verification -- age_minimum left
# unset (None) rather than guessed, per this ticket's own instruction.

[[offering]]
offering_id = "fleet-science-center-volunteer"
org_name = "Fleet Science Center"
title = "Volunteer Program"
offering_type = "volunteer"
description = "Fleet volunteers serve as Gallery Ambassadors facilitating science demonstrations and greeting visitors, support Community Engagement events (Family Science Night, Educator Open House, Junior Science Club), help with Special Events (IMAX premieres, the annual gala), assist at monthly Accessibility Mornings (sensory-friendly hours, third Saturday), and support seasonal STEM camps."
eligibility = "Must be 18 years of age or older. No short-term or community-service-only placements are offered."
age_minimum = 18
how_to_book = "Apply online through the Fleet's VolunteerMatters portal (fleetscience.volunteermatters.org). Volunteers must commit to a minimum of six months and complete quarterly onboarding (orientation and training). Questions: 619-238-1233 x835 or volunteerservices@rhfleet.org."
link_url = "https://www.fleetscience.org/volunteer"
last_verified = "2026-09-02"
status = "active"
related_partner_id = 121

