# Curated "where to go any day" San Diego STEM places -- a static,
# hand-researched roster (the FLL `static_roster` precedent -- see
# `directory/sources/static_roster.py`'s own module docstring), never a
# live scrape (issue 35's explicit instruction). Every category issue
# 35 named has at least one entry below -- see `directory/DESIGN.md`'s
# coverage table.
#
# Coordinates are curated from each place's own published address
# (`latitude`/`longitude` set directly below, verified against a public
# source -- an official site, NPS/county/city page, or a corroborating
# map listing -- never a live geocoder call). One entry (`atlas-labs`)
# has no single confident street-level coordinate to curate yet (it is
# not open); it omits `latitude`/`longitude` entirely and falls back to
# the shared `geo_ladder.GeoLadder`'s ZIP-centroid rung at pipeline
# time (`directory/pipeline.py`'s `_apply_geo_fallback`), never a
# guess.
#
# `related_partner_id` is a deliberate, hand-verified join against
# `site/src/data/partners.json`'s own `id` field -- never auto-derived
# (ticket 018-007's own instruction: "do not attempt an automatic
# cross-reference join this sprint... hand-copy the value"). Omitted
# entirely where no confident partner-roster match exists, rather than
# forced.

