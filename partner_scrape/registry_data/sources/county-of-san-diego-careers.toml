# County of San Diego -- NEOGOV/governmentjobs.com-backed careers board.
#
# Live-verified 2026-09-02 (sprint 031 ticket 006): GET
# https://www.governmentjobs.com/careers/sdcounty/home/loadJobsOnMaps
# (with X-Requested-With/Accept/Referer headers -- see
# adapters/neogov.py's module docstring for the full live-discovery
# write-up) -> HTTP 200, valid JSON, success=true, 72 raw postings,
# confirmed not paginated (the whole current jobList came back in one
# response) -- this batch's highest-yield of the four agencies.
#
# ats_filters.classify_posting result (2026-09-02 live re-check): 0 of
# 72 match classify_posting's internship + STEM + San Diego test. Two
# postings carry NEOGOV's own "Internship" Categories tag ("Student
# Worker-25090512-Undergraduate, Graduate/Tech and High School" and
# "Student Organizer Internship Program (Student Worker)-26090508U"),
# so is_internship_posting matches both via the commitment signal, but
# neither carries a STEM-coded title/department (Human Resources; a
# multi-department "Administrative Assistant/Community Services/.../
# Human Services" list) -- both correctly fail is_stem_posting. A
# working, zero-match pass, not a failure, per this sprint's own
# Success Criteria. Cadence matters more than any single run's yield
# for these agencies (issue 31) -- student/intern classes post
# seasonally.
#
# GENUINE BLOCK, disabled: www.governmentjobs.com/robots.txt disallows
# all bots except a named allow-list (Googlebot, bingbot, yahoobot,
# msnbot, gsa-crawler-www, NHN, Twitterbot, facebookexternalhit) --
# confirmed live 2026-09-02 ("User-agent: *\nDisallow: /" beneath that
# allow-list). This project's PoliteFetcher respects robots.txt by
# default (acquisition_policy.respect_robots defaults to true) and
# raises RobotsDisallowed for this bot's user agent against any path
# under this host. Same shape as servicenow.toml's (sprint 031 ticket
# 002) SmartRecruiters disable -- no stakeholder decision yet to
# override respect_robots for this vendor. Registered enabled=false
# rather than assumed respect_robots=false, per this sprint's own
# "enabled=false only for a genuine block" standard. The adapter itself
# (adapters/neogov.py) is fully built and tested against fixtures
# reproducing this live response shape (tests/test_adapters_neogov.py)
# -- flipping this source to enabled=true needs no further adapter
# code, only a registry edit plus a stakeholder decision to override
# respect_robots for this vendor.
#
# STAKEHOLDER DECISION, issue 44, 2026-09-02: Eric ruled "go ahead and
# scrape them." Enabled with a per-source respect_robots=false override
# (same mechanism as the iCal respect_robots=false precedent, issue
# 38/sprint 015); the project's global respect_robots default is
# unchanged. Scope and reasoning recorded in
# partner_scrape/registry/DO_NOT_SCRAPE.md's new Exceptions section.

org_name = "County of San Diego"
adapter_type = "neogov"
enabled = true  # enabled 2026-09-02 per issue 44 stakeholder decision (see header comment); genuine robots block remains, overridden via acquisition_policy.respect_robots below

[config]
agency = "sdcounty"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = false  # per-source override, issue 44, 2026-09-02 -- see header comment; global default unchanged
discovered_via = "issue 31 ATS census (2026-08-30), live-discovered and verified 2026-09-02 (sprint 031 ticket 006)"
