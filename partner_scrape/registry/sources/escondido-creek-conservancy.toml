# Escondido Creek Conservancy -- registered as a generic_html source for the real-scrape
# exercise (2026-07-19). Event URLs are discovered via the site's
# sitemap (discovery/sitemap.py probes sitemap_index.xml / sitemap.xml /
# sitemap-index.xml in order) and extracted with the standard ladder.
# Land trust with nature/education programs along Escondido Creek watershed.
# org_name matches the exact name in data/partners_viable.csv so the
# stem-ecosystem partner join resolves.
#
# Sprint 014 ticket 002 (issue 23): live-verified Wix site (2026-08-30 --
# response carries <meta name="generator" content="Wix.com Website
# Builder"/> plus static.wixstatic.com asset URLs), one of the "9 Wix
# partner sources" plain HTTP cannot render. Flagged headless only after
# this ticket's concurrency fix (dedicated single-worker executor +
# PlaywrightFetcher lock) landed and was fixture-tested.
#
# 2026-08-30 addendum (sprint 014 ticket 003 / issue 24 triage): a
# fresh live dry-run confirms this source is still zero-yield with
# fetch_strategy = "headless" in place, and root-caused why: the
# sitemap-diff discovery probe crashes outright --
# ``playwright._impl._errors.Error: Page.goto: net::ERR_ABORTED at
# https://escondidocreek.org/sitemap.xml``, caught by pipeline.py's
# per-source isolation. PlaywrightFetcher.get() (fetch/headless.py)
# navigates via page.goto()+page.content(), which is built for
# rendering an HTML page; Chromium aborts navigation to a raw .xml
# resource for at least some servers rather than serving it as
# fetchable content. The same underlying fetch/headless.py limitation
# was independently confirmed against climate-science-alliance.toml,
# gsdsef.toml, sandiego-cv-aopsacademy.toml, sdrvc.toml, and
# techadventurecamp.toml (a softer failure mode there: HTTP 200 but a
# body that fails to parse as sitemap XML, rather than a crash) and
# titanbot.toml / xplorstem.toml / lajollalibrary.toml (the same
# ERR_ABORTED crash). This is a fetch/ subsystem issue, out of this
# ticket's declared scope (registry/*.toml + adapters/*.py only) --
# flagged for a follow-up ticket rather than fixed here. The
# fetch_strategy = "headless" disposition from ticket 002 is left in
# place; it remains a valid, correctly-diagnosed cause of this site's
# original zero-yield (a real Wix JS-rendering gap), even though this
# separate sitemap-fetch bug is what's actually blocking recovery now.
#
# 2026-08-30 re-probe (sprint 015 ticket 002 / issue 37): with ticket
# 001's PlaywrightFetcher raw-resource fetch fix live, a fresh
# `--dry-run --no-enrich` re-probe finds 7 real event URLs (6 with
# recovered dates), e.g. event-details/a-hike-to-learn-how-to-help-save-
# franks-peak and four recurring "bill-the-bug-guy" sessions -- the
# net::ERR_ABORTED crash is gone and real events flow end-to-end. Best
# confirming evidence yet that this source's only blocker was the
# fetch bug, not the Wix JS-rendering gap alone. enabled = true kept
# (unchanged from before this ticket).

org_name = "Escondido Creek Conservancy"
adapter_type = "generic_html"
enabled = true

[config]
site_url = "https://escondidocreek.org"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = true
fetch_strategy = "headless"
discovered_via = "partners_viable.csv batch (real scrape exercise 2026-07-19)"
