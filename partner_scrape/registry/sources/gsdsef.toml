org_name = "Greater San Diego Science and Engineering Fair"
adapter_type = "generic_html"
enabled = true

[config]
site_url = "https://gsdsef.org"

[acquisition_policy]
rate_limit_seconds = 1.0
respect_robots = true
fetch_strategy = "headless"
discovered_via = "partners_viable.csv tier-2 bulk registration (2026-07-20)"

