# Sprint 014 ticket 002 (issue 23): live-verified Wix site (2026-08-30 --
# response carries <meta name="generator" content="Wix.com Website
# Builder"/> plus static.wixstatic.com asset URLs), one of the "9 Wix
# partner sources" plain HTTP cannot render (matches the 2026-08-30 gap
# analysis's own callout: "GSDSEF (Wix ... already partners and worth
