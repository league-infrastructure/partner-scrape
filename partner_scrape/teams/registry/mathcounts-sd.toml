# MATHCOUNTS San Diego Chapter school teams static roster -- a
# committed, hand-curated roster, not a live acquisition source,
# matching science-olympiad-sd.toml's/cyberpatriot-sd.toml's own
# precedent (issue 47's own "curated static-roster datasets by design"
# instruction).
#
# Sprint 036 ticket 006: populated from sprint 036 ticket 005's
# research finding -- the clearest new competition-team type this
# sprint's bounded research pass found (see teams/DESIGN.md's sprint
# 036 ticket 005 research findings section, and ticket 005's own Notes,
# for the full comparison against the other 16 candidate types
# checked). Roster content (thirteen San Diego County schools that
# fielded a named team at the 2026 San Diego Chapter MATHCOUNTS
# Competition) is drawn from the official, dated results document:
#
#   "2026 San Diego Chapter MATHCOUNTS Competition -- February 28,
#   2026 -- Official Results" (cspeef.org/wp-content/uploads/2026/03/
#   San-Diego-Chapter-2026-Competition-Official-Results.pdf), linked
#   directly from cspeef.org/competitions/san-diego/ (the same page
#   sprint 029's own `mathcounts-sd-chapter` event registration
#   already points at).
#
# Live-verified 2026-09-03 (this ticket's own execution, via `curl`
# from an unsandboxed shell, per this project's standing "real fetch,
# not a search-summary inference" standard): both the event page
# (HTTP 200, 96550 bytes) and the results PDF (HTTP 200, 580674 bytes,
# 5 pages, read in full) returned real, current content naming all 13
# schools, each fielding a 4-student team with a named head coach.
#
# Note on `registry/sources/mathcounts-sd-chapter.toml` (the sprint-029
# *event* registration, disabled): its header records a 2026-09-02 HTTP
# 403 from this project's own `PoliteFetcher` against
# cspeef.org/competitions/san-diego/ -- a WAF/bot-protection block, the
# same false-positive shape `registry/sources/cipherhacks.toml`
# documents (a block specific to this project's own fetcher's
# User-Agent, not a real outage). Ticket 005's research and this
# ticket's own re-verification both confirm a bare `curl` reaches that
# exact URL fine (HTTP 200) -- but per this ticket's own scope
# boundary, that finding does *not* flip `mathcounts-sd-chapter.toml`'s
# `enabled` flag here: issue 45 owns the disabled-source re-check sweep
# project-wide, and this ticket's job is the team roster, built
# directly from the results PDF, not the event-announcement source.
#
# `adapter_type` is read by teams.pipeline to select the matching
# TeamSource ("team_static_roster" ->
# teams.sources.team_static_roster.TeamStaticRosterSource), not by
# adapters.base.ADAPTERS -- see sources/team_static_roster.py's own
# module docstring.
#
# No [acquisition_policy] section: TeamStaticRosterSource reads
# config.roster_path straight off disk, matching science-olympiad-sd.
# toml's/cyberpatriot-sd.toml's own precedent exactly.

org_name = "MATHCOUNTS San Diego Chapter school teams (curated static roster)"
adapter_type = "team_static_roster"
enabled = true

[config]
# Resolved relative to teams/data/ when not already an absolute path
# (sources/team_static_roster.py's discover()).
roster_path = "mathcounts-sd.tsv"
