# San Diego-area Science Olympiad school teams static roster -- a
# committed, hand-curated roster, not a live acquisition source,
# matching fll-sd.toml's own precedent (issue 47's own "curated
# static-roster datasets by design" instruction).
#
# Sprint 036 ticket 002: migrated from directory/registry/
# science-olympiad-sd.toml (sprint 032 ticket 006) -- Science Olympiad
# is a competition team, not a club, per issue 47's meets-vs-competes
# rule. The roster content (twenty-four San Diego County high schools
# that fielded a Division C team at the 2026 San Diego Regional Science
# Olympiad Tournament, live-verified against Duosmium Results' archived
# official tournament results and the official San Diego Regional's own
# site, scilympiad.com/sdso) is carried over verbatim, not re-verified
# from scratch this ticket -- see directory/DESIGN.md's sprint 032
# ticket 006 Revision for the original sources checked, and this
# module's own sprint 036 Revision for the migration itself.
#
# `adapter_type` is read by teams.pipeline to select the matching
# TeamSource ("team_static_roster" ->
# teams.sources.team_static_roster.TeamStaticRosterSource), not by
# adapters.base.ADAPTERS -- see sources/team_static_roster.py's own
# module docstring.
#
# No [acquisition_policy] section: TeamStaticRosterSource reads
# config.roster_path straight off disk, matching fll-sd.toml's own
# precedent exactly.

org_name = "San Diego-area Science Olympiad school teams (curated static roster)"
adapter_type = "team_static_roster"
enabled = true

[config]
# Resolved relative to teams/data/ when not already an absolute path
# (sources/team_static_roster.py's discover()).
roster_path = "science-olympiad-sd.tsv"
